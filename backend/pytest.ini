[pytest]
# Only collect real pytest modules. The other files under app/tests
# (test_head_requests.py, verify_fix.py) are standalone integration scripts
# that hit a live server and are run manually, not collected here.
testpaths = app/tests
python_files = test_security.py test_solvency.py test_withdrawal_crawler.py
asyncio_mode = auto
addopts = -q
