<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090D"/>
      <stop offset="50%" stop-color="#0D0D12"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Gold Accent Glow -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card Background -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161622" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E0E17" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5C518"/>
      <stop offset="100%" stop-color="#FFDF6D"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title-main { font-weight: 800; font-size: 32px; fill: #F0F6FC; letter-spacing: -0.5px; }
    .title-gold { fill: #F5C518; filter: url(#gold-glow); }
    .tagline { font-size: 13.5px; fill: #A0A0B0; font-weight: 400; }
    .badge-text { font-size: 11px; font-weight: 600; }
  </style>

  <!-- Canvas Border & Background -->
  <rect x="0" y="0" width="850" height="440" rx="14" fill="url(#obsidian-bg)" stroke="#262636" stroke-width="1.5"/>

  <!-- Tactical Radial Grid Pattern (36px spacing) -->
  <g fill="#262636" opacity="0.35">
    <circle cx="36" cy="36" r="1.5"/><circle cx="72" cy="36" r="1.5"/><circle cx="108" cy="36" r="1.5"/><circle cx="144" cy="36" r="1.5"/>
    <circle cx="706" cy="36" r="1.5"/><circle cx="742" cy="36" r="1.5"/><circle cx="778" cy="36" r="1.5"/><circle cx="814" cy="36" r="1.5"/>
    <circle cx="36" cy="404" r="1.5"/><circle cx="72" cy="404" r="1.5"/><circle cx="814" cy="404" r="1.5"/>
  </g>

  <!-- Telegram WebApp Header Window Bar -->
  <path d="M 0 14 C 0 6, 6 0, 14 0 L 836 0 C 844 0, 850 6, 850 14 L 850 42 L 0 42 Z" fill="#12121A" stroke="#262636" stroke-width="1.5"/>
  <circle cx="20" cy="21" r="5.5" fill="#FF5F56"/>
  <circle cx="38" cy="21" r="5.5" fill="#FFBD2E"/>
  <circle cx="56" cy="21" r="5.5" fill="#27C93F"/>
  <text x="425" y="26" text-anchor="middle" class="mono" font-size="12" fill="#A0A0B0">tg://apps / chess_arena / $ socket.io --connect=wss://api.web3chess.online</text>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(635, 60)">
    <rect x="0" y="0" width="185" height="26" rx="13" fill="#0D0D12" stroke="#10B981" stroke-width="1.2"/>
    <circle cx="16" cy="13" r="4" fill="#10B981" filter="url(#emerald-glow)"/>
    <text x="28" y="17" class="mono badge-text" fill="#10B981">PVP_ARENA • LIVE 24/7</text>
  </g>

  <!-- Main Title & Tagline -->
  <g transform="translate(45, 95)">
    <text x="0" y="32" class="sans title-main">
      ♟️ CHESS TG BOT <tspan class="title-gold">ARENA</tspan>
    </text>
    <text x="0" y="56" class="mono" font-size="13" fill="#F5C518">
      Production Telegram Mini App • Real-Time PvP Matchmaking • TON/USDT Wagers
    </text>
    <text x="0" y="80" class="sans tagline">
      Next.js 16 App Router + FastAPI &amp; Socket.IO Engine • Obsidian Chess Visual Design System
    </text>
  </g>

  <!-- Feature Cards Grid (3 Columns) -->
  <g transform="translate(45, 200)">

    <!-- Card 1: Frontend & Mini App -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="240" height="110" rx="10" fill="url(#card-bg)" stroke="#F5C518" stroke-width="1.2" stroke-opacity="0.5"/>
      <rect x="12" y="12" width="216" height="26" rx="6" fill="#F5C518" fill-opacity="0.12"/>
      <text x="22" y="29" class="mono badge-text" fill="#F5C518">📱 TELEGRAM WEBAPP 8.0+</text>
      <text x="14" y="58" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">web3chess.online</text>
      <text x="14" y="76" class="mono" font-size="10" fill="#A0A0B0">Next.js 16 • Framer Motion</text>
      <text x="14" y="93" class="mono" font-size="9.5" fill="#10B981">// iOS Safe-Area Certified</text>
    </g>

    <!-- Card 2: Real-Time Engine -->
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="240" height="110" rx="10" fill="url(#card-bg)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.5"/>
      <rect x="12" y="12" width="216" height="26" rx="6" fill="#10B981" fill-opacity="0.12"/>
      <text x="22" y="29" class="mono badge-text" fill="#10B981">⚡ FASTAPI &amp; SOCKET.IO</text>
      <text x="14" y="58" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">api.web3chess.online</text>
      <text x="14" y="76" class="mono" font-size="10" fill="#A0A0B0">python-chess • Redis Pub/Sub</text>
      <text x="14" y="93" class="mono" font-size="9.5" fill="#10B981">// ~260 Pytest Integration Suites</text>
    </g>

    <!-- Card 3: Vault & Security -->
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="240" height="110" rx="10" fill="url(#card-bg)" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.5"/>
      <rect x="12" y="12" width="216" height="26" rx="6" fill="#3B82F6" fill-opacity="0.12"/>
      <text x="22" y="29" class="mono badge-text" fill="#3B82F6">🔒 TON VAULT &amp; SECURITY</text>
      <text x="14" y="58" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">TON / USDT Stakes</text>
      <text x="14" y="76" class="mono" font-size="10" fill="#A0A0B0">HMAC Confirmation • Nonces</text>
      <text x="14" y="93" class="mono" font-size="9.5" fill="#3B82F6">// Anti-Cheat Move Validator</text>
    </g>
  </g>

  <!-- Bottom Engine Bar -->
  <g transform="translate(45, 335)">
    <rect x="0" y="0" width="760" height="75" rx="10" fill="#12121A" stroke="#262636" stroke-width="1"/>

    <g transform="translate(20, 18)">
      <text x="0" y="14" class="sans" font-size="11.5" font-weight="700" fill="#F0F6FC">TIME CONTROLS:</text>
      
      <rect x="110" y="0" width="80" height="22" rx="4" fill="#0D0D12" stroke="#F5C518" stroke-width="1"/>
      <text x="150" y="15" text-anchor="middle" class="mono" font-size="10" fill="#F5C518">1+0 Bullet</text>

      <rect x="200" y="0" width="80" height="22" rx="4" fill="#0D0D12" stroke="#10B981" stroke-width="1"/>
      <text x="240" y="15" text-anchor="middle" class="mono" font-size="10" fill="#10B981">3+2 Blitz</text>

      <rect x="290" y="0" width="85" height="22" rx="4" fill="#0D0D12" stroke="#3B82F6" stroke-width="1"/>
      <text x="332.5" y="15" text-anchor="middle" class="mono" font-size="10" fill="#3B82F6">5+3 Rapid</text>
    </g>

    <g transform="translate(20, 50)">
      <text x="0" y="12" class="mono" font-size="10.5" fill="#A0A0B0">
        STACK: <tspan fill="#F0F6FC">Next.js 16</tspan> • <tspan fill="#F0F6FC">FastAPI</tspan> • <tspan fill="#F0F6FC">Socket.IO</tspan> • <tspan fill="#F0F6FC">PostgreSQL</tspan> • <tspan fill="#F0F6FC">Redis</tspan> • <tspan fill="#F0F6FC">Docker</tspan>
      </text>
    </g>

    <g transform="translate(635, 23)">
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#0D0D12" stroke="#F5C518" stroke-width="1"/>
      <text x="52.5" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#F5C518">Obsidian UI</text>
    </g>
  </g>
</svg>
