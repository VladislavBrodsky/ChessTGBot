  <text x="400" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#5A5A72" letter-spacing="2">PRODUCTION TOPOLOGY</text>
