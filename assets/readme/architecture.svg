  <text x="178" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#6A6A82">Backend API (Railway)</text>
  <circle cx="296" cy="234" r="4" fill="#2AABEE" />
  <text x="306" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#6A6A82">Telegram Platform</text>
