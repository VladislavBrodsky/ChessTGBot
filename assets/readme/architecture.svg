  <text x="416" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#6A6A82">Postgres + Alembic</text>
  <circle cx="516" cy="234" r="4" fill="#E0443C" />
  <text x="526" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#6A6A82">Redis Pub/Sub Cache</text>
