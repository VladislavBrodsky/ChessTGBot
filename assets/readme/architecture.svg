<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <linearGradient id="host-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161622"/>
      <stop offset="100%" stop-color="#0E0E17"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect x="0" y="0" width="850" height="240" rx="12" fill="#09090D" stroke="#262636" stroke-width="1.5"/>

  <!-- Client Box -->
  <g transform="translate(45, 45)">
    <rect x="0" y="0" width="220" height="150" rx="10" fill="url(#host-bg)" stroke="#F5C518" stroke-width="1.2"/>
    <text x="110" y="30" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#F5C518">📱 TELEGRAM CLIENT</text>
    <text x="110" y="52" text-anchor="middle" class="mono" font-size="10.5" fill="#A0A0B0">Bot API 8.0+ WebApp</text>
    <path d="M 20 65 L 200 65" stroke="#262636" stroke-width="1"/>
    <text x="30" y="88" class="sans" font-size="11" fill="#F0F6FC">• iOS Safe-Area Certified</text>
    <text x="30" y="108" class="sans" font-size="11" fill="#F0F6FC">• Next.js 16 App Router</text>
    <text x="30" y="128" class="sans" font-size="11" fill="#F0F6FC">• Framer Motion UI</text>
  </g>

  <!-- Connectors -->
  <g transform="translate(265, 95)">
    <path d="M 0 0 L 60 0" stroke="#10B981" stroke-width="2"/>
    <polygon points="60,-4 68,0 60,4" fill="#10B981"/>
    <text x="34" y="-10" text-anchor="middle" class="mono" font-size="9" fill="#10B981">HTTPS</text>
  </g>

  <g transform="translate(265, 145)">
    <path d="M 0 0 L 60 0" stroke="#F5C518" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="60,-4 68,0 60,4" fill="#F5C518"/>
    <text x="34" y="-10" text-anchor="middle" class="mono" font-size="9" fill="#F5C518">WSS Socket.IO</text>
  </g>

  <!-- Railway Service 1: Frontend -->
  <g transform="translate(335, 45)">
    <rect x="0" y="0" width="230" height="70" rx="10" fill="url(#host-bg)" stroke="#10B981" stroke-width="1.2"/>
    <text x="15" y="26" class="sans" font-size="13" font-weight="700" fill="#10B981">🌐 Frontend Host (Railway)</text>
    <text x="15" y="48" class="mono" font-size="11" fill="#F0F6FC">web3chess.online</text>
  </g>

  <!-- Railway Service 2: Backend -->
  <g transform="translate(335, 125)">
    <rect x="0" y="0" width="230" height="70" rx="10" fill="url(#host-bg)" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="15" y="26" class="sans" font-size="13" font-weight="700" fill="#3B82F6">⚡ Backend API (Railway)</text>
    <text x="15" y="48" class="mono" font-size="11" fill="#F0F6FC">api.web3chess.online</text>
  </g>

  <!-- Database & Redis Box -->
  <g transform="translate(615, 45)">
    <rect x="0" y="0" width="190" height="150" rx="10" fill="url(#host-bg)" stroke="#A855F7" stroke-width="1.2"/>
    <text x="95" y="30" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#A855F7">💾 DATA LAYER</text>
    <path d="M 20 45 L 170 45" stroke="#262636" stroke-width="1"/>
    <text x="30" y="70" class="sans" font-size="11.5" font-weight="600" fill="#F0F6FC">PostgreSQL</text>
    <text x="30" y="88" class="mono" font-size="10" fill="#A0A0B0">Users, Matches, Vault</text>
    <text x="30" y="115" class="sans" font-size="11.5" font-weight="600" fill="#F0F6FC">Redis</text>
    <text x="30" y="133" class="mono" font-size="10" fill="#A0A0B0">Pub/Sub, Queue Pool</text>
  </g>
</svg>
