  <line x1="620" y1="80" x2="627" y2="80" stroke="#2AABEE" stroke-width="1.2" stroke-opacity="0.5" marker-end="url(#arrow-tg)" />
  <line x1="540" y1="116" x2="540" y2="151" stroke="#F5C518" stroke-width="1" stroke-opacity="0.4" marker-end="url(#arrow-gold)" />
  <line x1="560" y1="116" x2="575" y2="151" stroke="#E0443C" stroke-width="1" stroke-opacity="0.4" marker-end="url(#arrow)" />
