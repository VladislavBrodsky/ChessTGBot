    <marker id="arrow-tg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2AABEE" />
    </marker>
  </defs>
  <rect width="800" height="260" rx="14" fill="url(#arch-bg)" stroke="#1E1E2E" stroke-width="1.5" />
