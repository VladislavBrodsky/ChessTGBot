  <text x="400" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#4A4A62">Framer Motion spring • damping: 25 • stiffness: 350 • No animation if prefers-reduced-motion</text>
