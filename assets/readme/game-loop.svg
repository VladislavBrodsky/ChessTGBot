<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D12" />
      <stop offset="100%" stop-color="#0A0A0F" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="100%" stop-color="#F5C518" />
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3D3D55" />
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F5C518" />
    </marker>
  </defs>
  <rect width="800" height="200" rx="14" fill="url(#bg)" stroke="#1E1E2E" stroke-width="1.5" />
  <text x="400" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#5A5A72" letter-spacing="2">REAL-TIME GAME LOOP STATE MACHINE</text>
  <!-- States -->
  <rect x="20" y="50" width="100" height="36" rx="8" fill="#0F1820" stroke="#2AABEE" stroke-width="1.5" stroke-opacity="0.8" />
  <text x="70" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#2AABEE">join_queue</text>
  <rect x="168" y="50" width="100" height="36" rx="8" fill="#0F1820" stroke="#F5C518" stroke-width="1.5" stroke-opacity="0.7" />
  <text x="218" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#F5C518">MATCHING</text>
  <rect x="316" y="50" width="100" height="36" rx="8" fill="#0F1820" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.8" />
  <text x="366" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#10B981">game_start</text>
  <rect x="464" y="50" width="100" height="36" rx="8" fill="#0F1820" stroke="#F5C518" stroke-width="1.5" stroke-opacity="0.7" />
  <text x="514" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#F5C518">IN GAME</text>
  <rect x="612" y="50" width="100" height="36" rx="8" fill="#0F1820" stroke="#7C72DC" stroke-width="1.5" stroke-opacity="0.8" />
  <text x="662" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#7C72DC">game_over</text>
  <!-- Arrows top row -->
  <line x1="120" y1="68" x2="165" y2="68" stroke="#2AABEE" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arr)" />
  <line x1="268" y1="68" x2="313" y2="68" stroke="#F5C518" stroke-width="1.5" stroke-opacity="0.6" marker-end="url(#arr-g)" />
  <line x1="416" y1="68" x2="461" y2="68" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arr)" />
  <line x1="564" y1="68" x2="609" y2="68" stroke="#F5C518" stroke-width="1.5" stroke-opacity="0.6" marker-end="url(#arr-g)" />
  <!-- Socket events detail row -->
  <rect x="316" y="114" width="100" height="28" rx="6" fill="#131320" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
  <text x="366" y="132" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#10B981">make_move</text>
  <rect x="464" y="114" width="100" height="28" rx="6" fill="#131320" stroke="#F5C518" stroke-width="1" stroke-opacity="0.4" />
  <text x="514" y="132" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#F5C518">move_made</text>
  <rect x="390" y="114" width="70" height="28" rx="0" fill="none" />
  <line x1="416" y1="128" x2="461" y2="128" stroke="#A0A0B0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)" />
  <rect x="316" y="154" width="100" height="28" rx="6" fill="#131320" stroke="#2AABEE" stroke-width="1" stroke-opacity="0.4" />
  <text x="366" y="172" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#2AABEE">draw_offer</text>
  <rect x="464" y="154" width="100" height="28" rx="6" fill="#131320" stroke="#7C72DC" stroke-width="1" stroke-opacity="0.4" />
  <text x="514" y="172" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7C72DC">draw_respond</text>
  <line x1="416" y1="168" x2="461" y2="168" stroke="#A0A0B0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)" />
  <text x="196" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5A5A72">Rating-based</text>
  <text x="196" y="146" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5A5A72">matchmaking</text>
  <text x="662" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5A5A72">Rating delta</text>
  <text x="662" y="146" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5A5A72">XP + Stakes</text>
</svg>
