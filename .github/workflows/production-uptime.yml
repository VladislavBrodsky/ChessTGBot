name: Production uptime

on:
  schedule:
    # This runs on GitHub infrastructure, independent of Railway. GitHub can
    # delay scheduled jobs during platform load, so it complements rather than
    # replaces an SLA-backed commercial uptime monitor.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-backend:
    name: Check production backend health
    runs-on: ubuntu-latest
    steps:
      - name: Request health endpoint
        id: health
        shell: bash
        run: |
          if curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 5 \
            https://chesstgbot-backend-production.up.railway.app/health > health.json; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or resolve incident
        uses: actions/github-script@v7
        env:
          HEALTHY: ${{ steps.health.outputs.healthy }}
        with:
          script: |
            const title = 'Production backend health check failed';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const incident = issues.find(issue => issue.title === title && !issue.pull_request);

            if (process.env.HEALTHY === 'true') {
              if (incident) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: incident.number,
                  body: `Recovered: the external health check succeeded at ${new Date().toISOString()}.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: incident.number, state: 'closed',
                });
              }
              return;
            }

            const body = [
              `The external GitHub Actions health check could not reach the production backend at ${new Date().toISOString()}.`,
              '',
              'Endpoint: https://chesstgbot-backend-production.up.railway.app/health',
              '',
              'This monitor runs outside Railway. Investigate Railway service status, networking, and billing; do not assume the backend can send its own alerts during this incident.',
            ].join('\n');
            if (!incident) {
              await github.rest.issues.create({ owner, repo, title, body });
            }
