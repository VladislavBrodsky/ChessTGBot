name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No lockfile: package-lock.json was removed (8c24bad5d) so Railway's
      # npm install resolves platform-specific swc deps per-OS. npm ci and the
      # setup-node npm cache both require a lockfile, so neither is usable here.
      - run: npm install
      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "true"
      # Blocking: next.config.ts sets ignoreBuildErrors=true so `next build` (SWC)
      # ships TS errors as-is. A missing import/prop like this becomes a runtime
      # ReferenceError that crashes the whole page in prod (see the 2026-07-11
      # wallet-page outage). This step is the only thing that catches that class
      # of bug before merge. Runs after build so tsconfig's .next/types/**/*.ts
      # include exists.
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      # Non-blocking: the codebase carries pre-existing lint warnings and one
      # intentional sync <script> (the Telegram SDK must load before hydration).
      # Surfaces issues without blocking merges on existing debt.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

  frontend-e2e:
    name: Frontend browser E2E
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: npm run test:e2e
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  backend:
    name: Backend (import + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Scratch Postgres for the migration gate below. pytest is unaffected: it
    # derives its DB from settings.DATABASE_URL, which stays sqlite here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Import the ASGI app so a broken import/syntax error fails CI instead of
      # the production container crash-looping on boot. Dummy secrets satisfy the
      # production config guard in get_settings() (non-sqlite + non-pytest), so
      # this genuinely exercises the production boot path — not a dev bypass.
      - name: Import check
        env:
          SECRET_KEY: ci-dummy-secret
          WEBHOOK_SECRET: ci-dummy-webhook-secret
          ADMIN_TELEGRAM_IDS: "999999"
        run: python -c "import app.main; print('app imports OK')"
      # A broken migration chain (duplicate revision, multiple heads, failing
      # DDL) passes the import check and pytest but crash-loops the production
      # container at boot, since both Docker entrypoints run `alembic upgrade
      # head` before uvicorn (2026-07-15 backend outage). Apply the full chain
      # to a fresh Postgres so it fails CI instead.
      - name: Alembic migrations on fresh Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_migrations
          SECRET_KEY: ci-dummy-secret
          WEBHOOK_SECRET: ci-dummy-webhook-secret
          ADMIN_TELEGRAM_IDS: "999999"
        run: python -m alembic upgrade head
      - name: Pytest
        run: python -m pytest

  static-export-fresh:
    name: Static export is up to date
    runs-on: ubuntu-latest
    # Only meaningful on PRs, where there is a base branch to diff against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check frontend/src changes shipped a rebuilt export
        run: bash scripts/check-static-export-fresh.sh "${{ github.event.pull_request.base.sha }}"
