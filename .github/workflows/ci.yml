name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-ops:
    name: Content engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r marketing/content-ops/requirements.txt
      - run: python3 -m unittest discover -s marketing/content-ops -p 'test_*.py'

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=optional
      - name: Translation integrity
        run: npm run check:messages
      - name: Design tokens in sync
        run: npm run tokens -- --check
      - name: Design rules (ratchet)
        run: npm run check:design
      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "true"
      # Keep a separate typecheck after build, when generated route types exist.
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      - name: Alternate-port proxy regression tests
        run: node --test scripts/port-proxy.spec-node.mjs
      # Blocking: the warning backlog was cleared (DEP-03), so lint is now a merge
      # gate. --max-warnings=0 keeps it at zero — a new warning fails CI. Genuinely
      # intentional cases (e.g. deliberate <img>/effect deps) carry a justified
      # eslint-disable comment rather than being tolerated in bulk.
      - name: Lint
        run: npm run lint -- --max-warnings=0

  frontend-e2e:
    name: Frontend browser E2E
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --include=optional
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: npm run test:e2e
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  website:
    name: Website (build + typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --include=optional
      # Build first: it is the only step that catches a bad token import from
      # design-system/website/theme.css or a server/client boundary mistake.
      - run: npm run build
      - name: Standalone request regression tests
        run: node --test scripts/requests.spec-node.mjs
      - run: npm run seo:check
      - run: npm run typecheck
      - run: npm run lint
      - name: Lighthouse CI Mobile & Desktop Audit
        run: |
          npm run audit:lighthouse
          npm run audit:lighthouse:desktop

  backend:
    name: Backend (import + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Scratch Postgres for the migration gate only. pytest runs on an explicit
    # sqlite file (deterministic, and a REAL engine — not the in-memory
    # MockAsyncSession). Previously pytest had no DATABASE_URL, so settings fell
    # back to the production Postgres default, 'chess_db_test' was unreachable, and
    # conftest silently degraded the WHOLE suite to the mock (validating ~nothing).
    # REQUIRE_REAL_DB below now makes that silent mock fallback a hard failure.
    # Running the full suite against asyncpg/Postgres is deferred: the async test
    # fixtures share a connection across the ASGI client and the test coroutine,
    # which aiosqlite tolerates but asyncpg rejects ("another operation is in
    # progress"). That conftest overhaul is tracked as DEP-03 follow-up. See DEP-03.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --require-hashes -r requirements.txt
      # Import the ASGI app so a broken import/syntax error fails CI instead of
      # the production container crash-looping on boot. Dummy secrets satisfy the
      # production config guard in get_settings() (non-sqlite + non-pytest), so
      # this genuinely exercises the production boot path — not a dev bypass.
      - name: Import check
        env:
          SECRET_KEY: ci-dummy-secret
          WEBHOOK_SECRET: ci-dummy-webhook-secret
          ADMIN_TELEGRAM_IDS: "999999"
        run: python -c "import app.main; print('app imports OK')"
      # A broken migration chain (duplicate revision, multiple heads, failing
      # DDL) passes the import check and pytest but crash-loops the production
      # container at boot, since both Docker entrypoints run `alembic upgrade
      # head` before uvicorn (2026-07-15 backend outage). Apply the full chain
      # to a fresh Postgres so it fails CI instead.
      - name: Alembic migrations on fresh Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_migrations
          SECRET_KEY: ci-dummy-secret
          WEBHOOK_SECRET: ci-dummy-webhook-secret
          ADMIN_TELEGRAM_IDS: "999999"
        run: python -m alembic upgrade head
      # Deterministic sqlite (a real engine, not the mock). REQUIRE_REAL_DB turns
      # conftest's silent MockAsyncSession fallback into a hard failure, so if the
      # engine can't be created the suite fails loudly instead of testing a mock.
      - name: Pytest
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
          REQUIRE_REAL_DB: "1"
        run: python -m pytest

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Preserve the critical-severity policy, but enforce it for both locked
      # production trees. Audit tooling dependencies are not production code.
      - name: npm audit (frontend production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical
      - name: npm audit (website production deps)
        working-directory: website
        run: npm audit --omit=dev --audit-level=critical
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Audit the complete hashed tree directly, without resolving it again.
      # The known backend backlog is fixed, so this is now a blocking check.
      - name: pip-audit (backend dependencies)
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements-audit.txt
          pip-audit --disable-pip --require-hashes -r requirements.txt --desc

  static-export-fresh:
    name: Static export is up to date
    runs-on: ubuntu-latest
    # Only meaningful on PRs, where there is a base branch to diff against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check frontend/src changes shipped a rebuilt export
        run: bash scripts/check-static-export-fresh.sh "${{ github.event.pull_request.base.sha }}"
