name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No lockfile: package-lock.json was removed (8c24bad5d) so Railway's
      # npm install resolves platform-specific swc deps per-OS. npm ci and the
      # setup-node npm cache both require a lockfile, so neither is usable here.
      - run: npm install
      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "true"
      # Blocking: next.config.ts sets ignoreBuildErrors=true so `next build` (SWC)
      # ships TS errors as-is. A missing import/prop like this becomes a runtime
      # ReferenceError that crashes the whole page in prod (see the 2026-07-11
      # wallet-page outage). This step is the only thing that catches that class
      # of bug before merge. Runs after build so tsconfig's .next/types/**/*.ts
      # include exists.
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      # Blocking: the warning backlog was cleared (DEP-03), so lint is now a merge
      # gate. --max-warnings=0 keeps it at zero — a new warning fails CI. Genuinely
      # intentional cases (e.g. deliberate <img>/effect deps) carry a justified
      # eslint-disable comment rather than being tolerated in bulk.
      - name: Lint
        run: npm run lint -- --max-warnings=0

  frontend-e2e:
    name: Frontend browser E2E
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: npm run test:e2e
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  backend:
    name: Backend (import + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres backs both the migration gate and pytest. Previously pytest had no
    # DATABASE_URL, so settings fell back to the production Postgres default,
    # 'chess_db_test' was unreachable, and conftest silently degraded the WHOLE
    # suite to an in-memory MockAsyncSession (validating ~nothing about real DB
    # semantics). REQUIRE_REAL_DB below now makes that fallback a hard failure and
    # the Pytest step targets this service. See DEP-03.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Import the ASGI app so a broken import/syntax error fails CI instead of
      # the production container crash-looping on boot. Dummy secrets satisfy the
      # production config guard in get_settings() (non-sqlite + non-pytest), so
      # this genuinely exercises the production boot path — not a dev bypass.
      - name: Import check
        env:
          SECRET_KEY: ci-dummy-secret
          WEBHOOK_SECRET: ci-dummy-webhook-secret
          ADMIN_TELEGRAM_IDS: "999999"
        run: python -c "import app.main; print('app imports OK')"
      # A broken migration chain (duplicate revision, multiple heads, failing
      # DDL) passes the import check and pytest but crash-loops the production
      # container at boot, since both Docker entrypoints run `alembic upgrade
      # head` before uvicorn (2026-07-15 backend outage). Apply the full chain
      # to a fresh Postgres so it fails CI instead.
      - name: Alembic migrations on fresh Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_migrations
          SECRET_KEY: ci-dummy-secret
          WEBHOOK_SECRET: ci-dummy-webhook-secret
          ADMIN_TELEGRAM_IDS: "999999"
        run: python -m alembic upgrade head
      # conftest derives the test DB as DATABASE_URL + "_test", so create
      # 'chess_db_test' in the service. psql is preinstalled on ubuntu-latest.
      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c "CREATE DATABASE chess_db_test;"
      # Run against the real Postgres service. REQUIRE_REAL_DB turns conftest's
      # silent MockAsyncSession fallback into a hard failure, so a DB that is
      # unreachable/misconfigured fails CI loudly instead of testing a mock. This
      # also lets the Postgres-only arena-targeting and row-lock concurrency tests
      # actually execute here.
      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chess_db
          REQUIRE_REAL_DB: "1"
        run: python -m pytest

  static-export-fresh:
    name: Static export is up to date
    runs-on: ubuntu-latest
    # Only meaningful on PRs, where there is a base branch to diff against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check frontend/src changes shipped a rebuilt export
        run: bash scripts/check-static-export-fresh.sh "${{ github.event.pull_request.base.sha }}"
